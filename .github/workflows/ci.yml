name: CI

# Repository quality gates (task T004). Reproducible locally per
# docs/20-devops-sre-and-platform-engineering/platform-reference.md
# ("CI uses GitHub Actions or an equivalent repository-native runner and must
# be reproducible locally"):
#
#   pnpm install --frozen-lockfile
#   pnpm run format:check
#   pnpm run lint
#   pnpm run typecheck
#   node --test tests/boundaries.test.mjs tests/tooling.test.mjs tests/config.test.mjs tests/traceability.test.mjs tests/database.test.mjs tests/rbac.test.mjs tests/session-security.test.mjs tests/audit.test.mjs tests/credential-vault.test.mjs tests/tenancy.test.mjs tests/auth.test.mjs tests/support-access.test.mjs tests/tenant-repository.test.mjs tests/jobs.test.mjs tests/outbox.test.mjs tests/storage.test.mjs tests/notifications.test.mjs tests/idempotency.test.mjs tests/observability.test.mjs tests/backup-restore.test.mjs tests/connectors.test.mjs tests/oauth.test.mjs tests/webhooks.test.mjs tests/connector-resilience.test.mjs tests/sync-reconciliation.test.mjs tests/shopify-oauth.test.mjs tests/shopify-bulk-import.test.mjs tests/shopify-webhooks.test.mjs tests/shopify-reconciliation.test.mjs tests/shopify-writeback.test.mjs tests/shopify-compliance.test.mjs tests/woocommerce.test.mjs tests/google-oauth.test.mjs tests/google-product-issues.test.mjs tests/google-aggregate-status.test.mjs tests/google-data-sources.test.mjs tests/google-quota.test.mjs tests/google-resolution-routing.test.mjs tests/diag-acquisition.test.mjs tests/diag-parsers.test.mjs tests/diag-schema-mapping.test.mjs tests/catalog.test.mjs tests/diag-identity-matching.test.mjs tests/diag-sync-checkpoints.test.mjs tests/diag-reconciliation.test.mjs tests/diag-engine.test.mjs tests/diag-validators-structural.test.mjs tests/diag-validators-identity.test.mjs tests/diag-validators-media.test.mjs tests/diag-validators-consistency.test.mjs tests/diag-issue-lifecycle.test.mjs tests/diag-scoring.test.mjs tests/diag-orchestration.test.mjs tests/repairs-registry.test.mjs tests/repairs-plan.test.mjs tests/repairs-preview.test.mjs tests/repairs-approval.test.mjs tests/repairs-executor.test.mjs tests/repairs-verification.test.mjs tests/repairs-rollback.test.mjs tests/repairs-rules.test.mjs
#   pnpm run check:traceability
#   pnpm run check:backup-restore
#
# The test files are listed explicitly (not `pnpm run test`) so CI exercises
# every test file present in tests/, independent of which ones the shared
# `test` script wires in — see the T004 completion report for why the shared
# script is left untouched. T002 (test harnesses) is expected to consolidate
# this into `pnpm run test` once its runner lands; update this list then.
#
# No secrets, external services, or deployment: install, build, lint, and test
# only. Nothing in this job can produce a production or irreversible side
# effect (AGENTS.md Forbidden Actions).

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck (also builds packages, e.g. packages/config/dist)
        run: pnpm run typecheck

      - name: Test
        run: node --test tests/boundaries.test.mjs tests/tooling.test.mjs tests/config.test.mjs tests/traceability.test.mjs tests/database.test.mjs tests/rbac.test.mjs tests/session-security.test.mjs tests/audit.test.mjs tests/credential-vault.test.mjs tests/tenancy.test.mjs tests/auth.test.mjs tests/support-access.test.mjs tests/tenant-repository.test.mjs tests/jobs.test.mjs tests/outbox.test.mjs tests/storage.test.mjs tests/notifications.test.mjs tests/idempotency.test.mjs tests/observability.test.mjs tests/backup-restore.test.mjs tests/connectors.test.mjs tests/oauth.test.mjs tests/webhooks.test.mjs tests/connector-resilience.test.mjs tests/sync-reconciliation.test.mjs tests/shopify-oauth.test.mjs tests/shopify-bulk-import.test.mjs tests/shopify-webhooks.test.mjs tests/shopify-reconciliation.test.mjs tests/shopify-writeback.test.mjs tests/shopify-compliance.test.mjs tests/woocommerce.test.mjs tests/google-oauth.test.mjs tests/google-product-issues.test.mjs tests/google-aggregate-status.test.mjs tests/google-data-sources.test.mjs tests/google-quota.test.mjs tests/google-resolution-routing.test.mjs tests/diag-acquisition.test.mjs tests/diag-parsers.test.mjs tests/diag-schema-mapping.test.mjs tests/catalog.test.mjs tests/diag-identity-matching.test.mjs tests/diag-sync-checkpoints.test.mjs tests/diag-reconciliation.test.mjs tests/diag-engine.test.mjs tests/diag-validators-structural.test.mjs tests/diag-validators-identity.test.mjs tests/diag-validators-media.test.mjs tests/diag-validators-consistency.test.mjs tests/diag-issue-lifecycle.test.mjs tests/diag-scoring.test.mjs tests/diag-orchestration.test.mjs tests/repairs-registry.test.mjs tests/repairs-plan.test.mjs tests/repairs-preview.test.mjs tests/repairs-approval.test.mjs tests/repairs-executor.test.mjs tests/repairs-verification.test.mjs tests/repairs-rollback.test.mjs tests/repairs-rules.test.mjs

      - name: UI component tests (Vitest + jsdom)
        run: pnpm --filter @fixmyfeed/ui test

      - name: Web app typecheck (Next.js, outside the root composite)
        run: pnpm --filter @fixmyfeed/web typecheck

      - name: Generated traceability check
        run: pnpm run check:traceability

      - name: Backup/restore documentation hook
        run: pnpm run check:backup-restore

  migration-apply:
    name: Migration apply (real Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Applies the whole migration chain (0000+) to a real PostgreSQL instance so
    # apply-time failures (bad SQL, FK ordering, triggers) are caught — offline
    # `drizzle-kit generate` and unit tests cannot catch these. Mirrors the
    # docker-local dependency environment (compose.yaml) in CI.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fixmyfeed
          POSTGRES_USER: fixmyfeed
          POSTGRES_PASSWORD: fixmyfeed_ci
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U fixmyfeed -d fixmyfeed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fixmyfeed:fixmyfeed_ci@localhost:5432/fixmyfeed
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.32.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply all migrations to real Postgres
        working-directory: packages/database
        run: pnpm exec drizzle-kit migrate --config=drizzle.config.ts

      - name: Database smoke test (schema present, audit immutability enforced)
        run: node tools/db-smoke.mjs
